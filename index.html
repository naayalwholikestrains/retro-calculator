
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casio FX Vintage Calculator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
}

:root {
  --body-top: #c7c9c1;
  --body-mid: #a7aaa1;
  --body-bottom: #898d84;
  --dark: #252a26;
  --screen: #a0ad91;
  --screen-text: #293829;
  --orange: #b56d32;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #20231f;
  display: flex;
  justify-content: center;
  align-items: stretch;
  font-family: 'Roboto Mono', monospace;
}

.calculator {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  padding: clamp(15px, 3vh, 35px) clamp(18px, 5vw, 65px);
  display: flex;
  flex-direction: column;
  background: linear-gradient(115deg, #d0d1c9 0%, #b9bcb3 35%, #969a91 100%);
  box-shadow:
    inset 3px 3px 5px #ffffff99,
    inset -4px -5px 10px #4c514b80;
  border: 2px solid #747970;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}

.brand {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(25px, 4vw, 45px);
  font-weight: 900;
  font-style: italic;
  letter-spacing: 3px;
  color: #333932;
  text-shadow: 1px 1px #e2e3db;
}

.brand-info {
  font-size: clamp(8px, 1vw, 12px);
  color: #454a43;
  letter-spacing: 2px;
  text-align: right;
}

.model {
  font-family: 'Roboto Mono', monospace;
  font-size: clamp(9px, 1.2vw, 13px);
  font-weight: 700;
  color: #41463f;
  letter-spacing: 3px;
  margin-bottom: 12px;
}

.display-frame {
  background: #656b60;
  padding: 7px;
  border-radius: 5px;
  margin-bottom: 14px;
  box-shadow:
    2px 3px 5px #3338,
    inset 1px 1px 2px #ffffff55;
}

.display {
  height: clamp(85px, 16vh, 145px);
  padding: 12px 16px;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 3px,
      #384b3510 4px
    ),
    linear-gradient(135deg, #aab69a, #929f83);
  border: 1px solid #64725a;
  box-shadow: inset 0 2px 9px #26342588;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
}

#history {
  font-family: 'Share Tech Mono', monospace;
  color: #516149;
  font-size: clamp(11px, 1.5vw, 16px);
  min-height: 15px;
  text-align: right;
  letter-spacing: 1px;
}

#screen {
  font-family: 'Orbitron', monospace;
  font-weight: 700;
  font-size: clamp(28px, 6vw, 65px);
  letter-spacing: clamp(2px, .6vw, 7px);
  color: var(--screen-text);
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  line-height: 1.2;
  text-shadow:
    1px 0 #293829,
    -1px 0 #293829,
    0 1px #293829;
  -webkit-font-smoothing: none;
  font-variant-numeric: tabular-nums;
}

/* MAIN KEYPAD */

.keys {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(5, minmax(0, 1fr));
  gap: clamp(7px, 1.5vw, 15px);
}

.key {
  min-height: 0;
  border: 1px solid #747970;
  border-radius: 8px;
  background: linear-gradient(145deg, #51574f, #30362f);
  color: #eeeee5;
  font-family: 'Orbitron', monospace;
  font-size: clamp(16px, 2.7vw, 27px);
  font-weight: 700;
  cursor: pointer;
  box-shadow:
    0 4px 0 #20251f,
    0 6px 7px #0004,
    inset 1px 1px 2px #ffffff30;
  transition: transform .08s, filter .1s;
}

.key:hover {
  filter: brightness(1.17);
}

.key:active {
  transform: translateY(3px);
  box-shadow:
    0 1px 0 #20251f,
    inset 1px 1px 3px #0005;
}

.key.operator {
  background: linear-gradient(145deg, #7d8378, #50564e);
}

.key.action {
  background: linear-gradient(145deg, #cb8a4c, #925329);
  border-color: #80502e;
  color: #fff8e9;
}

.key.equals {
  background: linear-gradient(145deg, #d1954e, #995c2b);
  border-color: #80502e;
  color: white;
}

.footer {
  flex-shrink: 0;
  margin-top: 13px;
  text-align: center;
  font-family: 'Orbitron', sans-serif;
  font-size: 9px;
  letter-spacing: 3px;
  color: #444a41;
}

/* SMALL SCREENS */

@media(max-width: 500px) {
  .calculator {
    padding: 12px;
  }

  .brand {
    font-size: 26px;
  }

  .keys {
    gap: 8px;
  }

  .key {
    border-radius: 6px;
  }
}

@media(max-height: 650px) {
  .calculator {
    padding-top: 8px;
    padding-bottom: 8px;
  }

  .display-frame {
    margin-bottom: 7px;
  }

  .display {
    height: 65px;
    padding: 7px 12px;
  }

  .model {
    margin-bottom: 6px;
  }

  .footer {
    margin-top: 7px;
  }
}
</style>
</head>

<body>

<div class="calculator">

  <div class="top">
    <div class="brand">CASIO</div>
    <div class="brand-info">
      PERSONAL<br>CALCULATOR
    </div>
  </div>

  <div class="model">
    FX SERIES · ELECTRONIC CALCULATOR
  </div>

  <div class="display-frame">
    <div class="display">
      <div id="history"></div>
      <div id="screen">0</div>
    </div>
  </div>

  <div class="keys">

    <button class="key action" onclick="clearAll()">AC</button>
    <button class="key action" onclick="backspace()">DEL</button>
    <button class="key operator" onclick="insert('%')">%</button>
    <button class="key operator" onclick="insert('/')">÷</button>

    <button class="key" onclick="insert('7')">7</button>
    <button class="key" onclick="insert('8')">8</button>
    <button class="key" onclick="insert('9')">9</button>
    <button class="key operator" onclick="insert('*')">×</button>

    <button class="key" onclick="insert('4')">4</button>
    <button class="key" onclick="insert('5')">5</button>
    <button class="key" onclick="insert('6')">6</button>
    <button class="key operator" onclick="insert('-')">−</button>

    <button class="key" onclick="insert('1')">1</button>
    <button class="key" onclick="insert('2')">2</button>
    <button class="key" onclick="insert('3')">3</button>
    <button class="key operator" onclick="insert('+')">+</button>

    <button class="key" onclick="insert('0')">0</button>
    <button class="key" onclick="insert('.')">.</button>
    <button class="key equals" onclick="calculate()">=</button>

  </div>

  <div class="footer">
    CASIO · FX SERIES
  </div>

</div>

<script>
let expression = "";
let justCalculated = false;

const screen = document.getElementById("screen");
const history = document.getElementById("history");

function render() {
  screen.textContent = expression || "0";
}

function insert(value) {
  if (justCalculated) {
    if (/^[0-9.]$/.test(value)) {
      expression = "";
    }
    justCalculated = false;
  }

  if (expression.length >= 45) return;

  expression += value;
  render();
}

function clearAll() {
  expression = "";
  history.textContent = "";
  justCalculated = false;
  render();
}

function backspace() {
  expression = expression.slice(0, -1);
  justCalculated = false;
  render();
}

/* BASIC MATHEMATICAL PARSER */

function evaluate(input) {
  const tokens = input.match(
    /\d+(?:\.\d*)?|\.\d+|[+\-*/()%]/g
  );

  if (!tokens || tokens.join("") !== input.replace(/\s/g, "")) {
    throw Error("Invalid expression");
  }

  let pos = 0;

  function peek() {
    return tokens[pos];
  }

  function take() {
    return tokens[pos++];
  }

  function expressionParser() {
    let value = term();

    while (peek() === "+" || peek() === "-") {
      const op = take();
      const right = term();
      value = op === "+" ? value + right : value - right;
    }

    return value;
  }

  function term() {
    let value = unary();

    while (["*", "/", "%"].includes(peek())) {
      const op = take();
      const right = unary();

      if (op === "*") value *= right;
      if (op === "/") value /= right;
      if (op === "%") value %= right;
    }

    return value;
  }

  function unary() {
    if (peek() === "-") {
      take();
      return -unary();
    }

    if (peek() === "+") {
      take();
      return unary();
    }

    return primary();
  }

  function primary() {
    const token = take();

    if (token === "(") {
      const value = expressionParser();

      if (take() !== ")") {
        throw Error("Missing bracket");
      }

      return value;
    }

    if (/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(token)) {
      return Number(token);
    }

    throw Error("Invalid expression");
  }

  const answer = expressionParser();

  if (pos !== tokens.length || !Number.isFinite(answer)) {
    throw Error("Math error");
  }

  return answer;
}

/* CALCULATE */

function calculate() {
  if (!expression) return;

  try {
    const oldExpression = expression;
    const answer = evaluate(expression);

    history.textContent = oldExpression + " =";
    expression = String(Number(answer.toPrecision(12)));

    justCalculated = true;
    render();

  } catch {
    history.textContent = "MATH ERROR";
    screen.textContent = "Error";
    expression = "";
    justCalculated = true;
  }
}

/* KEYBOARD SUPPORT */

document.addEventListener("keydown", event => {
  const key = event.key;

  if (/^[0-9.]$/.test(key)) {
    insert(key);
  }

  else if (["+", "-", "*", "/", "%", "(", ")"].includes(key)) {
    insert(key);
  }

  else if (key === "Enter" || key === "=") {
    event.preventDefault();
    calculate();
  }

  else if (key === "Backspace") {
    backspace();
  }

  else if (key === "Escape" || key === "Delete") {
    clearAll();
  }
});

render();
</script>

</body>
</html>
